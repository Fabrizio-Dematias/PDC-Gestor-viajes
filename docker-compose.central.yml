# Nodo central ("nuestro" — Servidor 1 del diagrama): entrada y
# almacenamiento. Ver docs/arquitectura-multi-nodo.md §2.
#
#   docker compose -f docker-compose.central.yml up -d
#
# Crea la red compartida `gestor-viajes`, que usan también
# docker-compose.workers.yml y docker-compose.agencias.yml para
# hablarle a estos servicios por nombre.

networks:
  gestor-viajes:
    name: gestor-viajes

volumes:
  postgres_datos:
  notificaciones_datos:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestor_viajes
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor
    ports:
      - '5432:5432'
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gestor']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gestor-viajes]

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks: [gestor-viajes]

  # Registro de servicios (Módulo 4): quién está vivo y dónde. Cada
  # servicio se anota acá al arrancar y el agregador le pide la lista de
  # instancias sanas. Nadie depende de él para funcionar: si se cae, los
  # clientes vuelven a las direcciones fijas de abajo (URL_*).
  registro:
    build: .
    command: ['servidor/registro/index.js']
    environment:
      PUERTO_REGISTRO: 4006
    ports:
      - '4006:4006'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4006/salud/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gestor-viajes]

  usuarios:
    build: .
    command: ['servidor/usuarios/index.js']
    environment:
      PUERTO_USUARIOS: 4003
      URL_REGISTRO: http://registro:4006
      # Dentro de la red de Compose la dirección que ven los demás es el
      # nombre del servicio, no localhost.
      URL_PROPIA: http://usuarios:4003
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: gestor_viajes
      PGUSER: gestor
      PGPASSWORD: gestor
    ports:
      - '4003:4003'
    # Readiness (no liveness): "listo" es que la base ya contesta.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4003/salud/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gestor-viajes]

  # Consumidor del canal asíncrono (Módulo 3): lee los eventos de reservas
  # de Redis Streams y "envía" las confirmaciones. Proceso aparte a
  # propósito: puede estar caído sin que ninguna reserva lo note.
  notificaciones:
    build: .
    command: ['servidor/notificaciones/index.js']
    environment:
      PUERTO_NOTIFICACIONES: 4005
      REDIS_URL: redis://redis:6379
      URL_REGISTRO: http://registro:4006
      URL_PROPIA: http://notificaciones:4005
    ports:
      - '4005:4005'
    volumes:
      - notificaciones_datos:/app/servidor/notificaciones/datos
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4005/salud/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - redis
      - registro
    networks: [gestor-viajes]

  agregador:
    build: .
    command: ['servidor/agregador/index.js']
    environment:
      PUERTO_AGREGADOR: 4000
      URL_REGISTRO: http://registro:4006
      URL_PROPIA: http://agregador:4000
      # Direcciones fijas: se usan si el registro no responde.
      URL_USUARIOS: http://usuarios:4003
      URL_VUELOS: http://vuelos:4001
      URL_HOSPEDAJE: http://hospedaje:4002
      URL_TRASLADO: http://traslado:4004
      URL_NOTIFICACIONES: http://notificaciones:4005
      REDIS_URL: redis://redis:6379
      # El agregador tiene que ver el mismo proveedor que vuelos: de ahí
      # deduce cuánto esperarle (con Duffel, 5,5 s en vez de 2,5 s).
      PROVEEDOR: ${PROVEEDOR:-ficticio}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/salud/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - usuarios
      - redis
      - registro
    networks: [gestor-viajes]
